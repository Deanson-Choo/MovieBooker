services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moviebooker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/initdb/001_schema_and_seed.sql:/docker-entrypoint-initdb.d/001_schema_and_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moviebooker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      FRONTEND_URL: http://localhost:4000
      POSTGRES_CONN_STR: postgresql://postgres:postgres@postgres:5432/moviebooker?sslmode=disable
      REDIS_ADDR: redis:6379
      ADMIN_API_KEY: dev-admin-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres-data: